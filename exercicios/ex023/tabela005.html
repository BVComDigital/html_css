<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
        }
        
        .destaque {
            background-color: greenyellow;
        }

        col.csexo {
            background-color: lightcoral;
        }

        col.cnome {
            background-color: rgb(132, 248, 141);
        }

        col.cgrupo {
            background-color: greenyellow;
        }


    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>

            <col class="csexo">
