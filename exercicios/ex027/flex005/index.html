<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Centralizado</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body {
            background-color: lightsalmon;
        }
        main {
            background-color: lightgreen;
            height: 300px;
            width: 100vw;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section {
            background-color: lightseagreen;
            height: 200px;
            width: 200px;
        }
        
    </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
            <p><b>Justfy-content</b> = alinha o conteúdo, os itens, dentro do eixo principal</p>
            <p><b>Align-itens</b> = alinha os itens no eixo transversal </p>
            <p><b>Align-content</b> = alinha os elementos no eixo transversal, quando estão empacotados. </p>
        </section>
    </main>
</body>
</html>
