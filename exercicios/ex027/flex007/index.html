<!-- O itens do flex-box tem order: 0. O order altera a ordem dos itens do flex box. -->

 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        div.conteiner {
            background-color: lightcoral;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: lightcyan;
            border:  1px solid black;
            text-align: center;
            padding: 20px;
        }

        div#id1 {
            order: 1;
        }
        div#id6 {
            order: -1;
        }
        div#id3 {
            order: 2;
        }
        div#id5 {
            order: 3;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="id1">A</div>
        <div class="item" id="id2">B</div>
        <div class="item" id="id3">C</div>
        <div class="item" id="id4">D</div>
        <div class="item" id="id5">E</div>
        <div class="item" id="id6">F</div>
        <div class="item" id="id7">G</div>

    </div>
</body>
</html>
