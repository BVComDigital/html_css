<!-- flex-shirink: => controla a encolhimento do item. Se for 1 significa que pode enconlher.   -->
<!-- flex-grow: => Controla o crescimento do item. Se for 0 não cresce.  -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        div.conteiner {
            background-color: lightcoral;
            display: flex;
            flex-flow: row nowrap;
        }
        div.conteiner2 {
            background-color: lightcoral;
            display: flex;
            flex-flow: row wrap;
        }

        div.item {
            background-color: lightcyan;
            border:  1px solid black;
            text-align: center;
            flex-basis: 300px;
            flex-shrink: 0;
            flex-grow: 0;

        }
        div.item2 {
            background-color: lightcyan;
            border:  1px solid black;
            text-align: center;
            flex-basis: 300px;
            flex-shrink: 0;

        }
        div.item3 {
            background-color: lightcyan;
            border:  1px solid black;
            text-align: center;
            flex-basis: 300px;
            flex-shrink: 1;
            flex-grow: 1;

        }
        div.item4 {
            background-color: lightcyan;
            border:  1px solid black;
            text-align: center;
            flex-basis: 300px;
            flex-shrink: 1;
            flex-grow: 1;

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">Outro conteúdo</div>
        <div class="item">C</div>

    </div>
    <br>
    <div class="conteiner2">
        <div class="item2">A</div>
        <div class="item2">Outro conteúdo</div>
        <div class="item2">C</div>

    </div>
    <br>
    <div class="conteiner">
        <div class="item3">A</div>
        <div class="item3">Outro conteúdo</div>
        <div class="item3">C</div>
    </div>
    <br>
    <div class="conteiner2">
        <div class="item4">A</div>
        <div class="item4">Outro conteúdo</div>
        <div class="item4">C</div>

    </div>
</body>
</html>
